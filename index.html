<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>RAJALIGA89 - Situs Resmi</title>
    <meta name="description" content="Kunjungi situs RAJALIGA89 melalui halaman resmi ini.">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            font-family: Arial, Helvetica, sans-serif;
            background:
                radial-gradient(circle at top, #252525 0%, #101010 45%, #050505 100%);
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 520px;
            text-align: center;
        }

        .card {
            background: rgba(20, 20, 20, 0.94);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 24px;
            padding: 42px 30px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(10px);
        }

        .logo {
            width: 90px;
            height: 90px;
            margin: 0 auto 22px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #f5c542, #ff8c00);
            color: #111;
            font-size: 26px;
            font-weight: 900;
            box-shadow: 0 10px 35px rgba(245, 197, 66, 0.25);
        }

        h1 {
            font-size: 32px;
            margin-bottom: 12px;
            letter-spacing: 1px;
        }

        .subtitle {
            color: #bdbdbd;
            line-height: 1.6;
            font-size: 15px;
            margin-bottom: 28px;
        }

        .status {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 8px 14px;
            border-radius: 999px;
            background: rgba(46, 204, 113, 0.1);
            color: #63e6a0;
            font-size: 13px;
            margin-bottom: 25px;
        }

        .dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #2ecc71;
            box-shadow: 0 0 10px #2ecc71;
        }

        .btn {
            display: block;
            width: 100%;
            padding: 16px 20px;
            border-radius: 14px;
            background: linear-gradient(135deg, #f5c542, #ff9800);
            color: #111;
            text-decoration: none;
            font-size: 17px;
            font-weight: 800;
            transition: 0.25s ease;
            box-shadow: 0 10px 30px rgba(255, 152, 0, 0.2);
        }

        .btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 15px 35px rgba(255, 152, 0, 0.35);
        }

        .countdown {
            margin-top: 18px;
            color: #888;
            font-size: 13px;
        }

        .countdown span {
            color: #fff;
            font-weight: bold;
        }

        .footer {
            margin-top: 25px;
            color: #666;
            font-size: 11px;
            line-height: 1.5;
        }

        @media (max-width: 480px) {
            .card {
                padding: 35px 22px;
                border-radius: 20px;
            }

            h1 {
                font-size: 27px;
            }

            .logo {
                width: 78px;
                height: 78px;
                font-size: 22px;
            }
        }
    </style>
</head>

<body>

    <main class="container">
        <section class="card">

            <div class="logo">
                R89
            </div>

            <div class="status">
                <span class="dot"></span>
                Situs dapat diakses
            </div>

            <h1>RAJALIGA89</h1>

            <p class="subtitle">
                Selamat datang di halaman akses RAJALIGA89.
                Klik tombol di bawah untuk melanjutkan ke situs tujuan.
            </p>

            <a
                class="btn"
                href="https://rajaliga89-mvp.my.id/"
                id="continueButton"
                rel="noopener noreferrer"
            >
                KUNJUNGI SITUS
            </a>

            <div class="countdown">
                Mengarahkan secara otomatis dalam
                <span id="timer">5</span> detik...
            </div>

            <div class="footer">
                © 2026 RAJALIGA89. Semua hak cipta dilindungi.
            </div>

        </section>
    </main>

    <script>
        const targetURL = "https://rajaliga89-mvp.my.id/";
        let seconds = 5;

        const timer = document.getElementById("timer");

        const countdown = setInterval(() => {
            seconds--;

            timer.textContent = seconds;

            if (seconds <= 0) {
                clearInterval(countdown);
                window.location.href = targetURL;
            }
        }, 1000);
    </script>

</body>
</html>
