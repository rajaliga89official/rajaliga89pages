<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>RAJALIGA89 | Login</title>
    <meta name="description" content="Halaman akses RAJALIGA89">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --gold: #d4af37;
            --gold-light: #f5d76e;
            --gold-dark: #9b7615;
            --black: #050505;
            --dark: #0d0d0d;
            --gray: #888;
        }

        body {
            min-height: 100vh;
            font-family: Arial, Helvetica, sans-serif;
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;

            background:
                radial-gradient(
                    circle at 50% 0%,
                    rgba(212, 175, 55, .16),
                    transparent 35%
                ),
                radial-gradient(
                    circle at 0% 100%,
                    rgba(212, 175, 55, .08),
                    transparent 30%
                ),
                #050505;
        }

        /* Decorative background */
        body::before {
            content: "";
            position: fixed;
            inset: 0;
            pointer-events: none;
            background:
                linear-gradient(
                    135deg,
                    transparent 49.5%,
                    rgba(212,175,55,.035) 50%,
                    transparent 50.5%
                );
            background-size: 80px 80px;
        }

        .wrapper {
            width: 100%;
            max-width: 430px;
            position: relative;
            z-index: 2;
        }

        .card {
            position: relative;
            padding: 42px 34px 32px;
            border-radius: 25px;

            background:
                linear-gradient(
                    145deg,
                    rgba(255,255,255,.055),
                    rgba(255,255,255,.015)
                );

            border: 1px solid rgba(212,175,55,.35);

            box-shadow:
                0 30px 80px rgba(0,0,0,.8),
                0 0 50px rgba(212,175,55,.08);

            backdrop-filter: blur(18px);
        }

        /* Gold top line */
        .card::before {
            content: "";
            position: absolute;
            top: 0;
            left: 12%;
            width: 76%;
            height: 2px;

            background: linear-gradient(
                90deg,
                transparent,
                var(--gold-light),
                var(--gold),
                transparent
            );

            box-shadow: 0 0 15px rgba(212,175,55,.7);
        }

        .logo {
            width: 88px;
            height: 88px;
            margin: 0 auto 22px;

            display: flex;
            align-items: center;
            justify-content: center;

            border-radius: 50%;

            background:
                linear-gradient(
                    145deg,
                    #f5d76e,
                    #d4af37 50%,
                    #8c6914
                );

            color: #080808;

            font-size: 23px;
            font-weight: 900;
            letter-spacing: 1px;

            border: 3px solid rgba(255,255,255,.12);

            box-shadow:
                0 0 0 5px rgba(212,175,55,.05),
                0 0 35px rgba(212,175,55,.25);
        }

        h1 {
            text-align: center;
            font-size: 29px;
            letter-spacing: 3px;
            margin-bottom: 8px;

            background: linear-gradient(
                90deg,
                #b78b22,
                #fff1a8,
                #d4af37
            );

            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }

        .welcome {
            text-align: center;
            color: #999;
            font-size: 13px;
            margin-bottom: 30px;
        }

        .input-group {
            position: relative;
            margin-bottom: 17px;
        }

        .input-group label {
            display: block;
            margin-bottom: 8px;
            color: #aaa;
            font-size: 12px;
            letter-spacing: .5px;
        }

        .input-wrap {
            position: relative;
        }

        .icon {
            position: absolute;
            left: 16px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--gold);
            font-size: 16px;
            pointer-events: none;
        }

        input {
            width: 100%;
            height: 52px;

            padding: 0 45px;

            color: #fff;
            font-size: 14px;

            background: rgba(0,0,0,.55);

            border: 1px solid #292929;
            border-radius: 12px;

            outline: none;

            transition: .25s ease;
        }

        input::placeholder {
            color: #555;
        }

        input:focus {
            border-color: rgba(212,175,55,.8);

            box-shadow:
                0 0 0 3px rgba(212,175,55,.07),
                0 0 20px rgba(212,175,55,.08);
        }

        .toggle-password {
            position: absolute;
            right: 15px;
            top: 50%;
            transform: translateY(-50%);

            border: none;
            background: none;

            color: #777;
            cursor: pointer;
            font-size: 14px;
        }

        .toggle-password:hover {
            color: var(--gold);
        }

        .login-btn {
            width: 100%;
            height: 53px;
            margin-top: 8px;

            border: none;
            border-radius: 12px;

            cursor: pointer;

            font-size: 14px;
            font-weight: 800;
            letter-spacing: 1.2px;

            color: #111;

            background:
                linear-gradient(
                    135deg,
                    #f5d76e,
                    #d4af37 50%,
                    #a57d18
                );

            box-shadow:
                0 10px 30px rgba(212,175,55,.18);

            transition: .25s ease;
        }

        .login-btn:hover {
            transform: translateY(-2px);

            box-shadow:
                0 15px 35px rgba(212,175,55,.3);
        }

        .login-btn:active {
            transform: translateY(0);
        }

        .divider {
            display: flex;
            align-items: center;
            gap: 12px;

            margin: 25px 0 18px;

            color: #555;
            font-size: 10px;
        }

        .divider::before,
        .divider::after {
            content: "";
            height: 1px;
            flex: 1;
            background: #242424;
        }

        .register-text {
            text-align: center;
            color: #777;
            font-size: 12px;
            line-height: 1.6;
        }

        .register-text a {
            color: var(--gold-light);
            text-decoration: none;
            font-weight: bold;
        }

        .status {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 7px;

            margin-top: 22px;

            color: #777;
            font-size: 10px;
        }

        .status-dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: #3dcc78;

            box-shadow: 0 0 8px #3dcc78;
        }

        .footer {
            text-align: center;
            margin-top: 20px;

            color: #444;
            font-size: 9px;
            line-height: 1.5;
        }

        @media (max-width: 480px) {
            body {
                padding: 15px;
            }

            .card {
                padding: 36px 23px 27px;
                border-radius: 21px;
            }

            .logo {
                width: 78px;
                height: 78px;
                font-size: 20px;
            }

            h1 {
                font-size: 25px;
            }
        }
    </style>
</head>

<body>

    <main class="wrapper">

        <section class="card">

            <div class="logo">
                R89
            </div>

            <h1>RAJALIGA89</h1>

            <p class="welcome">
                Selamat datang, silakan lanjutkan ke situs.
            </p>

            <!--
                Form ini TIDAK mengirim atau menyimpan
                username/password ke server.
            -->
            <form id="loginForm">

                <div class="input-group">
                    <label for="username">USERNAME</label>

                    <div class="input-wrap">

                        <span class="icon">♙</span>

                        <input
                            type="text"
                            id="username"
                            placeholder="Masukkan username"
                            autocomplete="off"
                        >

                    </div>
                </div>

                <div class="input-group">

                    <label for="password">PASSWORD</label>

                    <div class="input-wrap">

                        <span class="icon">◆</span>

                        <input
                            type="password"
                            id="password"
                            placeholder="Masukkan password"
                            autocomplete="off"
                        >

                        <button
                            type="button"
                            class="toggle-password"
                            id="togglePassword"
                            aria-label="Tampilkan password"
                        >
                            ◉
                        </button>

                    </div>
                </div>

                <button
                    type="submit"
                    class="login-btn"
                >
                    MASUK KE SITUS
                </button>

            </form>

            <div class="divider">
                AKSES SITUS
            </div>

            <div class="register-text">
                Belum memiliki akun?
                <a
                    href="https://rajaliga89-mvp.my.id/"
                    rel="noopener noreferrer"
                >
                    Daftar di situs
                </a>
            </div>

            <div class="status">
                <span class="status-dot"></span>
                Sistem online
            </div>

            <div class="footer">
                © 2026 RAJALIGA89. All Rights Reserved.
            </div>

        </section>

    </main>

    <script>

        const targetURL = "https://rajaliga89-mvp.my.id/";

        const form = document.getElementById("loginForm");

        const password =
            document.getElementById("password");

        const togglePassword =
            document.getElementById("togglePassword");

        /*
         * Tampilkan / sembunyikan password
         */
        togglePassword.addEventListener("click", function () {

            if (password.type === "password") {

                password.type = "text";
                togglePassword.textContent = "○";

            } else {

                password.type = "password";
                togglePassword.textContent = "◉";

            }

        });

        /*
         * Tombol hanya melakukan redirect.
         *
         * Username/password tidak dikirim
         * dan tidak disimpan oleh halaman ini.
         */
        form.addEventListener("submit", function (event) {

            event.preventDefault();

            window.location.href = targetURL;

        });

    </script>

</body>
</html>
