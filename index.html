<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>RAJALIGA89 - Login & Daftar</title>
    <meta name="description" content="RAJALIGA89 - Akses Login dan Daftar">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --red: #b30000;
            --gold: #d4af37;
            --gold-light: #ffe98a;
            --black: #030303;
        }

        html,
        body {
            width: 100%;
            min-height: 100%;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            color: #fff;

            background: 
                radial-gradient(
                    circle at 50% 30%,
                    #e60000 0%,
                    #990000 50%,
                    #590000 100%
                );

            background-attachment: fixed;
            overflow-x: hidden;
        }

        /* Background pattern (Efek garis laser tipis transparan) */
        body::before {
            content: "";
            position: fixed;
            inset: 0;
            pointer-events: none;

            background-image:
                linear-gradient(
                    45deg,
                    transparent 48%,
                    rgba(255, 255, 255, .03) 50%,
                    transparent 52%
                );

            background-size: 80px 80px;
            opacity: .8;
        }

        /* Red glow tambahan untuk efek kedalaman warna merah */
        body::after {
            content: "";
            position: fixed;

            width: 600px;
            height: 600px;

            left: 50%;
            top: 30%;

            transform: translate(-50%, -50%);

            background: rgba(255, 50, 50, 0.2);

            filter: blur(120px);
            pointer-events: none;
        }

        .container {
            width: 100%;
            max-width: 650px;

            min-height: 100vh;

            margin: auto;
            padding: 30px 18px;

            display: flex;
            flex-direction: column;

            align-items: center;
            justify-content: center;

            position: relative;
            z-index: 2;
        }

        /* =========================
           KOTAK EMAS TERANG PREMIUM
        ========================= */
        .branding-box {
            width: 100%;
            padding: 25px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            
            /* Garis kotak solid emas terang menyala */
            border: 2px solid #ffd700; 
            border-radius: 16px; 
            
            /* Background transparan gelap agar kontras emasnya keluar */
            background: rgba(0, 0, 0, 0.25); 
            
            /* Efek pendaran cahaya (glow) ganda di luar dan dalam kotak */
            box-shadow: 
                0 0 25px rgba(255, 215, 0, 0.35),
                inset 0 0 20px rgba(255, 215, 0, 0.15);
        }

        /* =========================
           LOGO
        ========================= */

        .logo {
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto; 
            border-radius: 0;
            background: transparent;
            border: none;
        }

        .logo img {
            width: 135px; 
            height: auto;
            object-fit: contain;
            display: block;
            
            filter: drop-shadow(0 0 15px rgba(255, 215, 0, 0.3)); 
            animation: logoGlow 3s ease-in-out infinite;
        }

        @keyframes logoGlow {
            0%, 100% {
                transform: scale(1);
                filter: drop-shadow(0 0 15px rgba(255, 215, 0, 0.3));
            }
            50% {
                transform: scale(1.03);
                filter: drop-shadow(0 0 25px rgba(255, 215, 0, 0.5));
            }
        }

        /* =========================
           BRAND
        ========================= */

        .brand {
            margin-top: 18px;

            font-size: 32px;
            font-weight: 900;

            letter-spacing: 4px;

            background:
                linear-gradient(
                    90deg,
                    #9b7418,
                    #fff1a5,
                    #ffd700,
                    #fff1a5,
                    #9b7418
                );

            -webkit-background-clip: text;
            background-clip: text;

            color: transparent;

            text-shadow:
                0 0 25px rgba(255, 215, 0, 0.3);
        }

        .subtitle {
            margin-top: 7px;

            color: #ffe1e1;

            font-size: 11px;
            letter-spacing: 2px;
            font-weight: bold;
            text-shadow: 0 1px 2px rgba(0,0,0,0.5);
        }

        /* =========================
           BANNER
        ========================= */

        .banner {
            width: 100%;

            margin-top: 28px;

            position: relative;

            overflow: hidden;

            border-radius: 19px;

            border: 1px solid rgba(255, 215, 0, 0.75);

            background: #400000;

            box-shadow:
                0 20px 60px rgba(0,0,0,.40),
                0 0 30px rgba(255, 215, 0, 0.2);

            line-height: 0;
        }

        .banner img {
            width: 100%;
            height: auto;

            display: block;

            object-fit: cover;
        }

        /* Efek cahaya banner */
        .banner::after {
            content: "";

            position: absolute;

            inset: 0;

            pointer-events: none;

            background:
                linear-gradient(
                    110deg,
                    transparent 30%,
                    rgba(255,255,255,.12) 50%,
                    transparent 70%
                );

            transform: translateX(-100%);

            animation: shine 5s infinite;
        }

        @keyframes shine {
            0% {
                transform: translateX(-100%);
            }

            45%, 100% {
                transform: translateX(100%);
            }
        }

        /* =========================
           BUTTONS
        ========================= */

        .buttons {
            width: 100%;

            display: grid;

            grid-template-columns: 1fr 1fr;

            gap: 14px;

            margin-top: 20px;
        }

        .btn {
            height: 56px;

            display: flex;

            align-items: center;
            justify-content: center;

            border-radius: 12px;

            text-decoration: none;

            font-size: 14px;
            font-weight: 900;

            letter-spacing: 1.3px;

            transition: .25s ease;
        }

        /* LOGIN (Warna Diubah Sama Persis Seperti Tombol Daftar) */

        .btn-login {
            color: #120000;

            /* Hapus linear-gradient dan ganti dengan kode emas solid terang ini */
            background: #ffd700; 

            border: 2px solid #fff5b3;
            box-shadow: 0 8px 25px rgba(255, 215, 0, 0.4);
        }


            border:
                1px solid rgba(255,255,255,.15);

            box-shadow:
                0 10px 30px rgba(255, 215, 0, 0.25);
        }

        .btn-login:hover {
            border-color: #ffffff;

            background:
                linear-gradient(
                    135deg,
                    #ffe98a,
                    #ffd700 45%,
                    #a77c16
                );

            box-shadow:
                0 15px 40px rgba(255, 215, 0, 0.4);
        }


        /* DAFTAR */

         .btn-register {
            color: #120000;

            /* Hapus linear-gradient dan ganti dengan kode emas solid terang ini */
            background: #ffd700; 

            border: 2px solid #fff5b3;
            box-shadow: 0 8px 25px rgba(255, 215, 0, 0.4);
        }


        .btn:hover {
            transform: translateY(-3px);
        }

        .btn-login:hover {
            border-color: var(--gold-light);

            background:
                linear-gradient(
                    135deg,
                    rgba(255,0,0,.60),
                    rgba(120,0,0,.90)
                );

            box-shadow:
                0 12px 35px rgba(255,0,0,.25);
        }

        .btn-register:hover {
            box-shadow:
                0 15px 40px rgba(255, 215, 0, 0.4);
        }

        /* =========================
           INFO BOX
        ========================= */

        .info {
            width: 100%;
            margin-top: 25px;
            padding: 15px;
            background: rgba(0, 0, 0, 0.25);
            border: 1px solid rgba(255, 215, 0, 0.3);
            border-radius: 12px;
            text-align: center;
            font-size: 13px;
            color: #fff;
            line-height: 1.6;
            text-shadow: 0 1px 3px rgba(0,0,0,0.5);
        }
    </style>
</head>
<body>

    <div class="container">
        
        <!-- KOTAK PREMIUM EMAS TERANG -->
        <div class="branding-box">
            <!-- LOGO -->
            <div class="logo">
                <img src="logo.png" alt="Logo RAJALIGA89">
            </div>

            <!-- BRAND -->
            <h1 class="brand">RAJALIGA89</h1>
            <p class="subtitle">AKSES LOGIN & DAFTAR RESMI</p>
        </div>

        <!-- BANNER -->
        <div class="banner">
            <img src="banner.png" alt="Banner">
        </div>

        <!-- BUTTONS -->
        <div class="buttons">
            <a href="https://rajaliga89.com" class="btn btn-login">LOGIN</a>
            <a href="https://rajaliga89.com" class="btn btn-register">DAFTAR</a>
        </div>

        <!-- INFO BOX -->
        <div class="info">
            RAJALIGA89 SITUS GACOR GAMPANG JP DAN MAXWIN , PERKALIAN X500 PASTI MELEDAK.
        </div>
    </div>

</body>
</html>
