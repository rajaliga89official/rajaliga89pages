<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>RAJALIGA89 - Login & Daftar</title>
    <meta name="description" content="RAJALIGA89 - Akses Login dan Daftar">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --red: #b30000;
            --gold: #d4af37;
            --gold-light: #ffe98a;
            --black: #030303;
        }

        html,
        body {
            width: 100%;
            min-height: 100%;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            color: #fff;

            background:
                radial-gradient(
                    circle at 50% 0%,
                    rgba(179, 0, 0, .30),
                    transparent 35%
                ),
                radial-gradient(
                    circle at 100% 100%,
                    rgba(212, 175, 55, .12),
                    transparent 30%
                ),
                linear-gradient(
                    145deg,
                    #030303,
                    #100303 55%,
                    #030303
                );

            overflow-x: hidden;
        }

        /* Background pattern */
        body::before {
            content: "";
            position: fixed;
            inset: 0;
            pointer-events: none;

            background-image:
                linear-gradient(
                    45deg,
                    transparent 48%,
                    rgba(255, 0, 0, .025) 50%,
                    transparent 52%
                );

            background-size: 80px 80px;
            opacity: .8;
        }

        /* Red glow */
        body::after {
            content: "";
            position: fixed;

            width: 500px;
            height: 500px;

            left: 50%;
            top: 20%;

            transform: translate(-50%, -50%);

            background: rgba(150, 0, 0, .10);

            filter: blur(100px);
            pointer-events: none;
        }

        .container {
            width: 100%;
            max-width: 650px;

            min-height: 100vh;

            margin: auto;
            padding: 30px 18px;

            display: flex;
            flex-direction: column;

            align-items: center;
            justify-content: center;

            position: relative;
            z-index: 2;
        }

        /* =========================
           LOGO
        ========================= */

        .logo {
            width: 105px;
            height: 105px;

            display: flex;
            align-items: center;
            justify-content: center;

            border-radius: 50%;

            background:
                linear-gradient(
                    145deg,
                    #fff0a0,
                    #d4af37 48%,
                    #825d0c
                );

            border: 3px solid rgba(255, 255, 255, .14);

            color: #090909;

            font-size: 28px;
            font-weight: 900;

            letter-spacing: 1px;

            box-shadow:
                0 0 0 6px rgba(212,175,55,.05),
                0 0 45px rgba(212,175,55,.28),
                0 0 80px rgba(179,0,0,.18);

            animation: logoGlow 3s ease-in-out infinite;
            overflow: hidden; /* Ditambahkan agar gambar bulat sempurna */
        }

        .logo img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        @keyframes logoGlow {
            0%, 100% {
                transform: scale(1);

                box-shadow:
                    0 0 0 6px rgba(212,175,55,.05),
                    0 0 40px rgba(212,175,55,.22);
            }

            50% {
                transform: scale(1.025);

                box-shadow:
                    0 0 0 7px rgba(212,175,55,.08),
                    0 0 60px rgba(212,175,55,.35);
            }
        }

        /* =========================
           BRAND
        ========================= */

        .brand {
            margin-top: 18px;

            font-size: 32px;
            font-weight: 900;

            letter-spacing: 4px;

            background:
                linear-gradient(
                    90deg,
                    #9b7418,
                    #fff1a5,
                    #d4af37,
                    #fff1a5,
                    #9b7418
                );

            -webkit-background-clip: text;
            background-clip: text;

            color: transparent;

            text-shadow:
                0 0 25px rgba(212,175,55,.12);
        }

        .subtitle {
            margin-top: 7px;

            color: #888;

            font-size: 11px;
            letter-spacing: 2px;
        }

        /* =========================
           BANNER
        ========================= */

        .banner {
            width: 100%;

            margin-top: 28px;

            position: relative;

            overflow: hidden;

            border-radius: 19px;

            border: 1px solid rgba(212,175,55,.75);

            background: #150000;

            box-shadow:
                0 20px 60px rgba(0,0,0,.60),
                0 0 30px rgba(212,175,55,.10);

            line-height: 0;
        }

        .banner img {
            width: 100%;
            height: auto;

            display: block;

            object-fit: cover;
        }

        /* Efek cahaya banner */
        .banner::after {
            content: "";

            position: absolute;

            inset: 0;

            pointer-events: none;

            background:
                linear-gradient(
                    110deg,
                    transparent 30%,
                    rgba(255,255,255,.08) 50%,
                    transparent 70%
                );

            transform: translateX(-100%);

            animation: shine 5s infinite;
        }

        @keyframes shine {
            0% {
                transform: translateX(-100%);
            }

            45%, 100% {
                transform: translateX(100%);
            }
        }

        /* =========================
           BUTTONS
        ========================= */

        .buttons {
            width: 100%;

            display: grid;

            grid-template-columns: 1fr 1fr;

            gap: 14px;

            margin-top: 20px;
        }

        .btn {
            height: 56px;

            display: flex;

            align-items: center;
            justify-content: center;

            border-radius: 12px;

            text-decoration: none;

            font-size: 14px;
            font-weight: 900;

            letter-spacing: 1.3px;

            transition: .25s ease;
        }

        /* LOGIN */

        .btn-login {
            color: var(--gold-light);

            background:
                linear-gradient(
                    135deg,
                    rgba(130,0,0,.25),
                    rgba(30,5,5,.75)
                );

            border:
                1px solid rgba(212,175,55,.65);

            box-shadow:
                0 8px 25px rgba(0,0,0,.35);
        }

        /* DAFTAR */

        .btn-register {
            color: #120000;

            background:
                linear-gradient(
                    135deg,
                    #ffe98a,
                    #d4af37 45%,
                    #a77c16
                );

            border:
                1px solid rgba(255,255,255,.15);

            box-shadow:
                0 10px 30px rgba(212,175,55,.20);
        }

        .btn:hover {
            transform: translateY(-3px);
        }

        .btn-login:hover {
            border-color: var(--gold-light);

            background:
                linear-gradient(
                    135deg,
                    rgba(170,0,0,.35),
                    rgba(30,5,5,.85)
                );

            box-shadow:
                0 12px 35px rgba(179,0,0,.20);
        }

        .btn-register:hover {
            box-shadow:
                0 15px 40px rgba(212,175,55,.35);
        }

        /* =========================
           INFO BOX (Perbaikan Bagian Terpotong)
        ========================= */

        .info {
            width: 100%;
            margin-top: 25px;
            padding: 15px;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(212, 175, 55, 0.2);
            border-radius: 12px;
            text-align: center;
            font-size: 13px;
            color: #ccc;
            line-height: 1.6;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- LOGO (Memakai tag img di dalam class .logo) -->
        <div class="logo">
            <img src="images/logo.png" alt="logo.png">
        </div>

        <!-- BRAND -->
        <h1 class="brand">RAJALIGA89</h1>
        <p class="subtitle">AKSES LOGIN & DAFTAR RESMI</p>

        <!-- BANNER -->
        <div class="banner">
            <img src="images/banner.png" alt="Banner">
        </div>

        <!-- BUTTONS (Jangan lupa ganti tanda # dengan link asli Anda nanti) -->
        <div class="buttons">
            <a href="#" class="btn btn-login">LOGIN</a>
            <a href="#" class="btn btn-register">DAFTAR</a>
        </div>

        <!-- INFO BOX -->
        <div class="info">
            Selamat datang di RAJALIGA89. Pastikan Anda selalu menggunakan link resmi untuk kenyamanan dan keamanan akses akun Anda.
        </div>
    </div>

</body>
</html>
