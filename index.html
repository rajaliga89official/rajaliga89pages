<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>RAJALIGA89 - Login & Daftar</title>
    <meta name="description" content="RAJALIGA89 - Akses Login dan Daftar">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --red: #b30000;
            --red-light: #ff2020;
            --red-dark: #5c0000;

            --gold: #d4af37;
            --gold-light: #ffe98a;
            --gold-dark: #8f6b13;

            --black: #030303;
        }

        html,
        body {
            width: 100%;
            min-height: 100%;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            color: #fff;

            background:
                radial-gradient(
                    circle at 50% 0%,
                    rgba(179, 0, 0, .30),
                    transparent 35%
                ),
                radial-gradient(
                    circle at 100% 100%,
                    rgba(212, 175, 55, .12),
                    transparent 30%
                ),
                linear-gradient(
                    145deg,
                    #030303,
                    #100303 55%,
                    #030303
                );

            overflow-x: hidden;
        }

        /* Background pattern */
        body::before {
            content: "";
            position: fixed;
            inset: 0;

            pointer-events: none;

            background-image:
                linear-gradient(
                    45deg,
                    transparent 48%,
                    rgba(255, 0, 0, .025) 50%,
                    transparent 52%
                );

            background-size: 80px 80px;

            opacity: .8;
        }

        /* Red glow */
        body::after {
            content: "";

            position: fixed;

            width: 500px;
            height: 500px;

            left: 50%;
            top: 20%;

            transform: translate(-50%, -50%);

            background: rgba(150, 0, 0, .10);

            filter: blur(100px);

            pointer-events: none;
        }

        .container {
            width: 100%;
            max-width: 650px;

            min-height: 100vh;

            margin: auto;

            padding: 30px 18px;

            display: flex;
            flex-direction: column;

            align-items: center;
            justify-content: center;

            position: relative;
            z-index: 2;
        }

        /* =========================
           LOGO
        ========================= */

        .logo {
            width: 105px;
            height: 105px;

            display: flex;
            align-items: center;
            justify-content: center;

            border-radius: 50%;

            background:
                linear-gradient(
                    145deg,
                    #fff0a0,
                    #d4af37 48%,
                    #825d0c
                );

            border: 3px solid
                rgba(255, 255, 255, .14);

            color: #090909;

            font-size: 28px;
            font-weight: 900;

            letter-spacing: 1px;

            box-shadow:
                0 0 0 6px
                    rgba(212,175,55,.05),

                0 0 45px
                    rgba(212,175,55,.28),

                0 0 80px
                    rgba(179,0,0,.18);

            animation: logoGlow 3s ease-in-out infinite;
        }

        @keyframes logoGlow {

            0%,
            100% {
                transform: scale(1);

                box-shadow:
                    0 0 0 6px
                        rgba(212,175,55,.05),

                    0 0 40px
                        rgba(212,175,55,.22);
            }

            50% {
                transform: scale(1.025);

                box-shadow:
                    0 0 0 7px
                        rgba(212,175,55,.08),

                    0 0 60px
                        rgba(212,175,55,.35);
            }
        }

        /* =========================
           BRAND
        ========================= */

        .brand {
            margin-top: 18px;

            font-size: 32px;
            font-weight: 900;

            letter-spacing: 4px;

            background:
                linear-gradient(
                    90deg,
                    #9b7418,
                    #fff1a5,
                    #d4af37,
                    #fff1a5,
                    #9b7418
                );

            -webkit-background-clip: text;
            background-clip: text;

            color: transparent;

            text-shadow:
                0 0 25px
                rgba(212,175,55,.12);
        }

        .subtitle {
            margin-top: 7px;

            color: #888;

            font-size: 11px;

            letter-spacing: 2px;
        }

        /* =========================
           PROMO
        ========================= */

        .promo {
            width: 100%;

            margin-top: 28px;

            padding: 25px 22px;

            position: relative;

            overflow: hidden;

            text-align: center;

            border-radius: 19px;

            background:
                linear-gradient(
                    135deg,
                    #090909 10%,
                    #350505 50%,
                    #100800 100%
                );

            border:
                1px solid
                rgba(212,175,55,.40);

            box-shadow:
                0 20px 60px
                    rgba(0,0,0,.60),

                inset 0 0 40px
                    rgba(179,0,0,.08);
        }

        .promo::before {
            content: "";

            position: absolute;

            width: 210px;
            height: 210px;

            right: -105px;
            top: -105px;

            border-radius: 50%;

            border:
                1px solid
                rgba(212,175,55,.18);

            box-shadow:
                0 0 0 25px
                    rgba(212,175,55,.025),

                0 0 0 50px
                    rgba(212,175,55,.015);
        }

        .promo::after {
            content: "★";

            position: absolute;

            left: -20px;
            bottom: -45px;

            color:
                rgba(212,175,55,.055);

            font-size: 130px;
        }

        .promo-label {
            color: var(--gold-light);

            font-size: 10px;
            font-weight: bold;

            letter-spacing: 2px;
        }

        .promo h1 {
            margin-top: 9px;

            font-size: 25px;

            background:
                linear-gradient(
                    90deg,
                    #ff5a5a,
                    #fff0a0,
                    #d4af37
                );

            -webkit-background-clip: text;
            background-clip: text;

            color: transparent;
        }

        .promo p {
            margin-top: 8px;

            color: #999;

            font-size: 12px;

            line-height: 1.6;
        }

        /* =========================
           BUTTONS
        ========================= */

        .buttons {
            width: 100%;

            display: grid;

            grid-template-columns:
                1fr 1fr;

            gap: 14px;

            margin-top: 20px;
        }

        .btn {
            height: 56px;

            display: flex;

            align-items: center;
            justify-content: center;

            border-radius: 12px;

            text-decoration: none;

            font-size: 14px;
            font-weight: 900;

            letter-spacing: 1.3px;

            transition: .25s ease;
        }

        /* Login */
        .btn-login {
            color: var(--gold-light);

            background:
                linear-gradient(
                    135deg,
                    rgba(130,0,0,.25),
                    rgba(30,5,5,.75)
                );

            border:
                1px solid
                rgba(212,175,55,.65);

            box-shadow:
                0 8px 25px
                    rgba(0,0,0,.35);
        }

        /* Daftar */
        .btn-register {
            color: #120000;

            background:
                linear-gradient(
                    135deg,
                    #ffe98a,
                    #d4af37 45%,
                    #a77c16
                );

            border:
                1px solid
                rgba(255,255,255,.15);

            box-shadow:
                0 10px 30px
                    rgba(212,175,55,.20);
        }

        .btn:hover {
            transform:
                translateY(-3px);
        }

        .btn-login:hover {
            border-color:
                var(--gold-light);

            background:
                linear-gradient(
                    135deg,
                    rgba(170,0,0,.35),
                    rgba(30,5,5,.85)
                );

            box-shadow:
                0 12px 35px
                    rgba(179,0,0,.20);
        }

        .btn-register:hover {
            box-shadow:
                0 15px 40px
                    rgba(212,175,55,.35);
        }

        /* =========================
           INFO BOX
        ========================= */

        .info {
            width: 100%;

            margin-top: 20px;

            padding: 20px;

            display: grid;

            grid-template-columns:
                repeat(3, 1fr);

            gap: 10px;

            border-radius: 16px;

            background:
                linear-gradient(
                    145deg,
                    rgba(255,255,255,.035),
                    rgba(100,0,0,.06)
                );

            border:
                1px solid
                rgba(255,255,255,.07);
        }

        .info-item {
            text-align: center;
        }

        .info-icon {
            color: var(--gold);

            font-size: 18px;

            margin-bottom: 7px;
        }

        .info-title {
            color: #999;

            font-size: 10px;

            text-transform: uppercase;
        }

        .info-text {
            color: #eee;

            font-size: 11px;

            margin-top: 4px;
        }

        /* =========================
           STATUS
        ========================= */

        .status {
            display: flex;

            align-items: center;
            justify-content: center;

            gap: 7px;

            margin-top: 20px;

            color: #666;

            font-size: 10px;
        }

        .dot {
            width: 7px;
            height: 7px;

            border-radius: 50%;

            background: #32d17b;

            box-shadow:
                0 0 10px
                #32d17b;
        }

        /* =========================
           FOOTER
        ========================= */

        footer {
            margin-top: 18px;

            text-align: center;

            color: #444;

            font-size: 9px;

            line-height: 1.6;
        }

        /* =========================
           MOBILE
        ========================= */

        @media (max-width: 500px) {

            .container {
                padding:
                    25px 13px;
            }

            .logo {
                width: 85px;
                height: 85px;

                font-size: 22px;
            }

            .brand {
                font-size: 25px;

                letter-spacing: 3px;
            }

            .promo {
                padding:
                    21px 15px;
            }

            .promo h1 {
                font-size: 21px;
            }

            .buttons {
                grid-template-columns:
                    1fr;
            }

            .info {
                padding:
                    15px 8px;
            }
        }
    </style>
</head>

<body>

</body>
</html>
