<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>RAJALIGA89 - Login & Daftar</title>

    <meta
        name="description"
        content="RAJALIGA89 - Akses Login dan Daftar"
    >

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --gold: #d4af37;
            --gold-light: #ffe89a;
            --gold-dark: #8c6914;
            --black: #030303;
        }

        html,
        body {
            width: 100%;
            min-height: 100%;
        }

        body {
            font-family:
                Arial,
                Helvetica,
                sans-serif;

            color: #fff;

            background:
                radial-gradient(
                    circle at 50% 0%,
                    rgba(212,175,55,.20),
                    transparent 35%
                ),
                radial-gradient(
                    circle at 0% 100%,
                    rgba(212,175,55,.08),
                    transparent 30%
                ),
                #030303;
        }

        /* =========================
           BACKGROUND EFFECT
        ========================= */

        body::before {
            content: "";

            position: fixed;
            inset: 0;

            pointer-events: none;

            background-image:
                linear-gradient(
                    45deg,
                    transparent 48%,
                    rgba(212,175,55,.025) 50%,
                    transparent 52%
                );

            background-size: 70px 70px;
        }

        /* =========================
           MAIN
        ========================= */

        .container {
            width: 100%;
            max-width: 650px;

            min-height: 100vh;

            margin: auto;

            display: flex;
            flex-direction: column;

            align-items: center;
            justify-content: center;

            padding: 25px 18px;

            position: relative;
            z-index: 2;
        }

        /* =========================
           LOGO
        ========================= */

        .logo {
            width: 105px;
            height: 105px;

            display: flex;
            align-items: center;
            justify-content: center;

            border-radius: 50%;

            background:
                linear-gradient(
                    145deg,
                    #fff1a3,
                    #d4af37 48%,
                    #85630f
                );

            border: 3px solid
                rgba(255,255,255,.15);

            color: #080808;

            font-size: 28px;
            font-weight: 900;

            letter-spacing: 1px;

            box-shadow:
                0 0 0 6px
                    rgba(212,175,55,.05),
                0 0 50px
                    rgba(212,175,55,.25);

            animation:
                logoGlow 3s infinite ease-in-out;
        }

        @keyframes logoGlow {

            0%,
            100% {
                box-shadow:
                    0 0 0 6px
                        rgba(212,175,55,.05),
                    0 0 35px
                        rgba(212,175,55,.18);
            }

            50% {
                box-shadow:
                    0 0 0 7px
                        rgba(212,175,55,.08),
                    0 0 55px
                        rgba(212,175,55,.35);
            }
        }

        /* =========================
           BRAND
        ========================= */

        .brand {
            margin-top: 18px;

            font-size: 32px;
            font-weight: 900;

            letter-spacing: 4px;

            background:
                linear-gradient(
                    90deg,
                    #9b7418,
                    #fff2a5,
                    #d4af37,
                    #fff2a5,
                    #9b7418
                );

            -webkit-background-clip: text;
            background-clip: text;

            color: transparent;
        }

        .subtitle {
            margin-top: 7px;

            color: #777;

            font-size: 12px;
            letter-spacing: 1px;
        }

        /* =========================
           PROMO BANNER
        ========================= */

        .promo {
            width: 100%;

            margin-top: 27px;

            padding: 22px;

            position: relative;
            overflow: hidden;

            text-align: center;

            border-radius: 18px;

            background:
                linear-gradient(
                    135deg,
                    #090909,
                    #211a08,
                    #080808
                );

            border:
                1px solid
                rgba(212,175,55,.35);

            box-shadow:
                0 20px 55px
                    rgba(0,0,0,.55);
        }

        .promo::before {
            content: "";

            position: absolute;

            width: 180px;
            height: 180px;

            right: -90px;
            top: -90px;

            border-radius: 50%;

            border:
                1px solid
                rgba(212,175,55,.16);

            box-shadow:
                0 0 0 25px
                    rgba(212,175,55,.025),
                0 0 0 50px
                    rgba(212,175,55,.015);
        }

        .promo-label {
            color: var(--gold-light);

            font-size: 10px;
            font-weight: bold;

            letter-spacing: 2px;
        }

        .promo h1 {
            margin-top: 8px;

            font-size: 24px;

            background:
                linear-gradient(
                    90deg,
                    #fff0a0,
                    #d4af37
                );

            -webkit-background-clip: text;
            background-clip: text;

            color: transparent;
        }

        .promo p {
            margin-top: 7px;

            color: #888;

            font-size: 12px;
            line-height: 1.6;
        }

        /* =========================
           BUTTONS
        ========================= */

        .buttons {
            width: 100%;

            display: grid;

            grid-template-columns:
                1fr 1fr;

            gap: 14px;

            margin-top: 20px;
        }

        .btn {
            height: 55px;

            display: flex;

            align-items: center;
            justify-content: center;

            border-radius: 12px;

            text-decoration: none;

            font-size: 14px;
            font-weight: 900;

            letter-spacing: 1px;

            transition:
                transform .25s,
                box-shadow .25s;
        }

        .btn-login {

            color: var(--gold-light);

            background:
                rgba(212,175,55,.07);

            border:
                1px solid
                rgba(212,175,55,.55);

            box-shadow:
                0 8px 25px
                rgba(212,175,55,.05);
        }

        .btn-register {

            color: #111;

            background:
                linear-gradient(
                    135deg,
                    #fff0a0,
                    #d4af37 50%,
                    #9b7418
                );

            border:
                1px solid
                rgba(255,255,255,.1);

            box-shadow:
                0 10px 30px
                rgba(212,175,55,.18);
        }

        .btn:hover {

            transform:
                translateY(-3px);
        }

        .btn-login:hover {

            box-shadow:
                0 12px 30px
                rgba(212,175,55,.15);
        }

        .btn-register:hover {

            box-shadow:
                0 15px 35px
                rgba(212,175,55,.32);
        }

        /* =========================
           INFO
        ========================= */

        .info {

            width: 100%;

            margin-top: 20px;

            padding: 20px;

            display: grid;

            grid-template-columns:
                repeat(3, 1fr);

            gap: 10px;

            border-radius: 16px;

            background:
                rgba(255,255,255,.025);

            border:
                1px solid
                rgba(255,255,255,.06);
        }

        .info-item {
            text-align: center;
        }

        .info-icon {
            color: var(--gold);

            font-size: 18px;

            margin-bottom: 7px;
        }

        .info-title {
            color: #aaa;

            font-size: 10px;

            text-transform: uppercase;
        }

        .info-text {
            color: #eee;

            font-size: 11px;

            margin-top: 4px;
        }

        /* =========================
           STATUS
        ========================= */

        .status {

            display: flex;

            align-items: center;
            justify-content: center;

            gap: 7px;

            margin-top: 20px;

            color: #666;

            font-size: 10px;
        }

        .dot {

            width: 7px;
            height: 7px;

            border-radius: 50%;

            background: #32d17b;

            box-shadow:
                0 0 10px
                #32d17b;
        }

        /* =========================
           FOOTER
        ========================= */

        footer {

            margin-top: 18px;

            text-align: center;

            color: #444;

            font-size: 9px;

            line-height: 1.6;
        }

        /* =========================
           MOBILE
        ========================= */

        @media (max-width: 500px) {

            .container {
                padding:
                    25px 13px;
            }

            .logo {
                width: 85px;
                height: 85px;

                font-size: 22px;
            }

            .brand {
                font-size: 25px;

                letter-spacing: 3px;
            }

            .promo {
                padding: 20px 15px;
            }

            .promo h1 {
                font-size: 21px;
            }

            .buttons {
                grid-template-columns:
                    1fr;
            }

            .info {
                grid-template-columns:
                    repeat(3, 1fr);

                padding: 15px 8px;
            }
        }

    </style>
</head>


<body>

<div class="container">

</body>
</html>
